<div class="page-shell">
  <section class="page-hero">
    <p class="eyebrow">Search</p>
    <h1>Search the Club website</h1>
    <p class="hero-dek">Find pages across the public OUACC website.</p>
    <div class="ornament"></div>
  </section>
  <main class="content-wrap" id="main-content">
    <article class="content search-page">
      <form id="site-search-form" class="site-search-form">
        <label for="site-search">Search OUACC</label>
        <div class="search-row"><input id="site-search" type="search" name="q" placeholder="Search the website"><button class="button button-solid" type="submit">Search</button></div>
      </form>
      <p id="search-status" class="search-status">Enter a search term to begin.</p>
      <div id="search-results" class="search-results" aria-live="polite"></div>
    </article>
  </main>
</div>
