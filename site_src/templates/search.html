<div class="page-shell">

  <section class="page-hero">

    <p class="eyebrow">
      Search
    </p>

    <h1>
      Search the Club website
    </h1>

    <p class="hero-dek">
      Find pages, competitions, coaching information, history and practical information.
    </p>

    <div class="ornament"></div>

  </section>


  <main
    class="content-wrap"
    id="main-content"
  >

    <article class="content search-page">

      <form
        id="site-search-form"
        class="site-search-form"
        role="search"
      >

        <label for="site-search-input">
          Search OUACC
        </label>

        <div class="search-form-row">

          <input
            id="site-search-input"
            name="q"
            type="search"
            autocomplete="off"
            placeholder="Search the Club website"
            aria-describedby="search-help"
          >

          <button
            class="button button-solid"
            type="submit"
          >
            Search
          </button>

        </div>

        <p
          id="search-help"
          class="search-help"
        >
          Try a name, event, place or topic.
        </p>

      </form>


      <p
        id="search-status"
        class="search-status"
        aria-live="polite"
      ></p>


      <div
        id="search-results"
        class="search-results"
      ></div>

    </article>

  </main>

</div>
