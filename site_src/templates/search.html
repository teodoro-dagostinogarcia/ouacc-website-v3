{% extends "base.html" %}
{% block main %}
<div class="page-shell narrow-shell">
  <nav class="breadcrumb" aria-label="Breadcrumb"><a href="{{ root }}index.html">Home</a><span aria-hidden="true">/</span><span aria-current="page">Search</span></nav>
  <section class="page-hero"><p class="eyebrow">Website</p><h1>Search OUACC</h1><p class="hero-dek">Search the public Club website.</p><div class="ornament" aria-hidden="true"></div></section>
  <section class="search-panel">
    <form id="site-search-form" class="site-search-form" action="search.html" method="get">
      <label for="site-search">Search</label>
      <div class="search-row"><input id="site-search" name="q" type="search" placeholder="Search the site" autocomplete="off"><button class="button button-solid" type="submit">Search</button></div>
    </form>
    <div id="search-results" aria-live="polite"></div>
  </section>
</div>
{% endblock %}
